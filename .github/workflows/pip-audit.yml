name: pip-audit

# Pre-deploy dependency security gate. Fails the run (and thus the deploy
# review) if any package pinned in requirements.txt has a known CVE.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Scan requirements.txt for known CVEs
        run: |
          pip-audit -r requirements.txt --progress-spinner off
        # pip-audit exits non-zero when vulnerabilities are found; a non-zero
        # exit here is exactly what we want — it blocks merge/deploy.